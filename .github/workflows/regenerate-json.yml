name: Regenerate JSON from Excel

on:
  push:
    paths:
      - '**.xlsx'
      - '**.xls'
  workflow_dispatch:

jobs:
  generate-json:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install openpyxl
      
      - name: Generate JSON from Excel
        run: python scripts/excel-to-json.py "2026 - Rekap Input CAMS.xlsx" worker/sheets/
      
      - name: Commit and push JSON files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add worker/sheets/
          git diff --staged --quiet || git commit -m "Regenerate JSON cache from Excel"
          git push
